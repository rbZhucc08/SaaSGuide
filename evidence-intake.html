<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SaaSGuide 文本证据接入"><title>SaaSGuide｜文本证据</title><link rel="icon" href="data:,"><link rel="stylesheet" href="v2-shell.css"><link rel="stylesheet" href="evidence-intake.css"></head><body><div class="demo-notice" role="note"><span class="demo-notice__badge">LOCAL DEMO</span><strong>人工核对</strong><span>文档内容仅作为证据，不具备指令权限</span></div><div class="app-shell">
<aside class="sidebar" aria-label="主导航"><a class="brand" href="/"><span class="brand__mark">S</span><span><strong>SaaSGuide</strong><small>项目风险工作台</small></span></a><nav class="nav-list"><a href="/"><span>⌂</span>概览</a><a href="/data-sources"><span>⇧</span>数据源</a><a href="/risk-radar"><span>◈</span>风险雷达</a><a class="is-active" href="/evidence-intake" aria-current="page"><span>▤</span>文本证据</a><a href="/knowledge-base"><span>◎</span>知识库</a><a href="/action-tracker"><span>✓</span>行动跟踪</a><a href="/reports"><span>▥</span>报告</a><a href="/input-lab"><span>◇</span>输入实验室</a></nav><div class="sidebar__footer"><strong>保存前核对</strong><small>接受、修改或驳回每条候选</small></div></aside>
<main class="main-content"><header class="page-header"><div><p class="eyebrow">EVIDENCE INTAKE</p><h1>文本证据</h1><p class="subtitle">从 TXT、Markdown 或 DOCX 中提取带原文位置的事实候选。</p></div><a class="secondary-button" href="/risk-radar">查看风险雷达</a></header>
<section class="panel"><div><h2>解析文件</h2><p>最大 2 MB；DOCX 表格保留表格和行号。</p></div><div class="actions"><input id="file" type="file" accept=".txt,.md,.docx"><button id="upload" class="primary-button">生成预览</button><button id="sample" class="secondary-button">加载模拟样本</button></div></section><div id="message" class="message hidden" role="status"></div>
<section id="summary" class="hidden"><div class="heading"><div><h2>解析摘要</h2><p id="source"></p></div><span id="model" class="badge"></span></div><div id="metrics" class="metrics"></div></section>
<section id="review" class="hidden"><div class="heading"><div><h2>人工核对</h2><p>逐条选择接受、修改后接受或驳回。</p></div></div><div id="cards" class="cards"></div><div class="save"><label>核对人<input id="reviewer" value="本地演示用户" maxlength="80"></label><button id="save" class="primary-button">保存核对结果</button></div></section>
</main></div><script src="evidence-intake.js"></script></body></html>
