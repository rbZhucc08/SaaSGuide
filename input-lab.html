<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SaaSGuide 输入能力状态"><title>SaaSGuide｜输入实验室</title><link rel="icon" href="data:,"><link rel="stylesheet" href="v2-shell.css"><link rel="stylesheet" href="input-lab.css"></head><body><div class="demo-notice" role="note"><span class="demo-notice__badge">LOCAL DEMO</span><strong>能力状态</strong><span>未配置的能力不会显示为可用</span></div><div class="app-shell">
<aside class="sidebar" aria-label="主导航"><a class="brand" href="/"><span class="brand__mark">S</span><span><strong>SaaSGuide</strong><small>项目风险工作台</small></span></a><nav class="nav-list"><a href="/"><span>⌂</span>概览</a><a href="/data-sources"><span>⇧</span>数据源</a><a href="/risk-radar"><span>◈</span>风险雷达</a><a href="/evidence-intake"><span>▤</span>文本证据</a><a href="/knowledge-base"><span>◎</span>知识库</a><a href="/action-tracker"><span>✓</span>行动跟踪</a><a href="/reports"><span>▥</span>报告</a><a class="is-active" href="/input-lab" aria-current="page"><span>◇</span>输入实验室</a></nav><div class="sidebar__footer"><strong>输入状态</strong><small>解析、检测与模拟适配</small></div></aside>
<main class="main-content"><header class="page-header"><div><p class="eyebrow">INPUT LAB</p><h1>输入实验室</h1><p class="subtitle">查看 PDF、语音和外部适配器的当前可用状态。</p></div><a class="secondary-button" href="/reports">查看报告</a></header><div id="message" class="message hidden"></div>
<div class="grid"><section><div class="capability-heading"><span class="status-dot is-ready"></span><h2>普通 PDF</h2></div><p>解析内置会议纪要，保留页码和文件哈希。</p><button id="pdf" class="primary-button">解析 PDF 样本</button><div id="pdf-result" class="result"></div></section>
<section><div class="capability-heading"><span class="status-dot is-limited"></span><h2>扫描 PDF / OCR</h2></div><p>可检测是否需要 OCR；当前未配置 OCR 引擎。</p><span class="status-label">仅检测</span></section>
<section><div class="capability-heading"><span class="status-dot is-limited"></span><h2>语音</h2></div><p>可读取能力状态；当前不执行语音转写。</p><button id="voice" class="secondary-button">读取状态</button><div id="voice-result" class="result"></div></section>
<section><div class="capability-heading"><span class="status-dot is-ready"></span><h2>外部适配器</h2></div><p>验证模拟合约，不向外部系统发送请求。</p><button id="adapter" class="primary-button">验证模拟适配器</button><div id="adapter-result" class="result"></div></section></div>
</main></div><script src="shell.js"></script><script src="input-lab.js"></script></body></html>
