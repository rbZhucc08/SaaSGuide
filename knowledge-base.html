<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SaaSGuide 本地知识库"><title>SaaSGuide｜知识库</title><link rel="icon" href="data:,"><link rel="stylesheet" href="v2-shell.css"><link rel="stylesheet" href="knowledge-base.css"></head><body><div class="demo-notice" role="note"><span class="demo-notice__badge">LOCAL DEMO</span><strong>有依据才回答</strong><span>引用来自本地模拟知识文档</span></div><div class="app-shell">
<aside class="sidebar" aria-label="主导航"><a class="brand" href="/"><span class="brand__mark">S</span><span><strong>SaaSGuide</strong><small>项目风险工作台</small></span></a><nav class="nav-list"><a href="/"><span>⌂</span>概览</a><a href="/data-sources"><span>⇧</span>数据源</a><a href="/risk-radar"><span>◈</span>风险雷达</a><a href="/evidence-intake"><span>▤</span>文本证据</a><a class="is-active" href="/knowledge-base" aria-current="page"><span>◎</span>知识库</a><a href="/action-tracker"><span>✓</span>行动跟踪</a><a href="/reports"><span>▥</span>报告</a><a href="/input-lab"><span>◇</span>输入实验室</a></nav><div class="sidebar__footer"><strong>版本化引用</strong><small>依据不足时明确拒答</small></div></aside>
<main class="main-content"><header class="page-header"><div><p class="eyebrow">KNOWLEDGE BASE</p><h1>知识库问答</h1><p class="subtitle">检索当前生效文档，并展示版本与原文引用。</p></div><a class="secondary-button" href="/evidence-intake">查看文本证据</a></header>
<section class="ask"><label for="question">问题</label><div><input id="question" placeholder="例如：高风险需要多久升级？"><button id="ask" class="primary-button">检索并回答</button><button id="evaluate" class="secondary-button">运行隔离评测</button></div></section><div id="message" class="message hidden"></div>
<section id="answer" class="hidden"><div class="title"><h2 id="decision"></h2><span id="generation"></span></div><p id="answer-text"></p><p id="version" class="version"></p><div id="citations"></div></section>
<section id="eval" class="hidden"><h2>模拟评测结果</h2><div id="metrics" class="metrics"></div><p>结果仅适用于这组内置问题。</p></section>
<section class="policy-workspace"><div class="section-heading"><div><h2>制度与项目案例</h2><p id="policy-summary">正在读取当前知识版本。</p></div><button id="new-policy" class="primary-button" type="button">新增制度</button></div><div id="policy-list" class="policy-list"></div></section>
<section id="policy-editor" class="hidden"><div class="section-heading"><div><h2 id="policy-editor-title">编辑制度</h2><p>生效版本会参与知识问答和 Agent 引用检索。</p></div><button id="cancel-policy" class="secondary-button" type="button">取消</button></div><form id="policy-form" class="policy-form"><label>制度编号<input id="policy-id" required maxlength="80"></label><label>名称<input id="policy-title" required maxlength="120"></label><label>版本<input id="policy-version" required maxlength="30"></label><label>生效日期<input id="policy-date" type="date" required></label><label>状态<select id="policy-status"><option value="effective">生效</option><option value="superseded">已被替代</option><option value="draft">草稿</option><option value="retired">废止</option></select></label><label>标签（逗号分隔）<input id="policy-tags" maxlength="300"></label><label class="wide">正文<textarea id="policy-content" required maxlength="5000"></textarea></label><button class="primary-button" type="submit">保存制度</button></form></section>
</main></div><script src="shell.js"></script><script src="knowledge-base.js"></script></body></html>
