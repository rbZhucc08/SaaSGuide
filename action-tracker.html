<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaSGuide｜行动跟踪</title><link rel="icon" href="data:,"><link rel="stylesheet" href="action-tracker.css"></head><body><div class="notice"><b>LEARNING DEMO</b><span>本地 SQLite · 模拟候选风险 · 不指派真实人员</span></div><div class="layout"><aside><a href="/" class="logo">S</a><nav><a href="/">总览</a><a href="/knowledge-base">知识库</a><a class="active" href="/action-tracker">行动跟踪</a></nav><small>V2-P5<br>人工确认与审计</small></aside><main><header><p>ACTION TRACKER</p><h1>行动、期限和状态事件</h1><span>只有勾选人工确认后才能创建；每次状态变化保留操作人和时间。</span></header><section><h2>创建模拟行动</h2><div class="form"><label>行动<input id="title" value="重新组织接口评审"></label><label>负责人角色<input id="owner" value="技术负责人"></label><label>期限<input id="due" type="date" value="2026-09-08"></label><label>完成信号<input id="signal" value="评审记录为通过"></label><label>确认人<input id="actor" value="本地演示用户"></label><label class="check"><input id="confirmed" type="checkbox">我已人工核对并确认保存</label><button id="create">创建行动</button></div></section><div id="message" class="message hidden"></div><section><div class="section-title"><h2>行动列表</h2><button id="refresh" class="secondary">刷新</button></div><div id="summary" class="metrics"></div><div id="actions" class="cards"></div></section></main></div><script src="action-tracker.js"></script></body></html>
