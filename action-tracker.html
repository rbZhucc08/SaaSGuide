<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SaaSGuide 行动跟踪"><title>SaaSGuide｜行动跟踪</title><link rel="icon" href="data:,"><link rel="stylesheet" href="v2-shell.css"><link rel="stylesheet" href="action-tracker.css"></head><body><div class="demo-notice" role="note"><span class="demo-notice__badge">LOCAL DEMO</span><strong>人工确认</strong><span>行动和状态事件保存在本地</span></div><div class="app-shell">
<aside class="sidebar" aria-label="主导航"><a class="brand" href="/"><span class="brand__mark">S</span><span><strong>SaaSGuide</strong><small>项目风险工作台</small></span></a><nav class="nav-list"><a href="/"><span>⌂</span>概览</a><a href="/data-sources"><span>⇧</span>数据源</a><a href="/risk-radar"><span>◈</span>风险雷达</a><a href="/evidence-intake"><span>▤</span>文本证据</a><a href="/knowledge-base"><span>◎</span>知识库</a><a class="is-active" href="/action-tracker" aria-current="page"><span>✓</span>行动跟踪</a><a href="/reports"><span>▥</span>报告</a><a href="/input-lab"><span>◇</span>输入实验室</a></nav><div class="sidebar__footer"><strong>审计记录</strong><small>保留操作人、状态和时间</small></div></aside>
<main class="main-content"><header class="page-header"><div><p class="eyebrow">ACTION TRACKER</p><h1>行动跟踪</h1><p class="subtitle">创建有负责人、期限和完成信号的行动，并更新处理状态。</p></div><a class="secondary-button" href="/risk-radar">查看风险雷达</a></header>
<section><h2>创建行动</h2><div class="form"><label>候选风险编号<input id="candidate" placeholder="从风险雷达复制候选编号"></label><label>行动<input id="title" placeholder="输入具体行动"></label><label>负责人角色<input id="owner" placeholder="例如：项目负责人"></label><label>期限<input id="due" type="date"></label><label>完成信号<input id="signal" placeholder="输入可核查的完成信号"></label><label>确认人<input id="actor" placeholder="输入本次操作人"></label><label class="check"><input id="confirmed" type="checkbox">我已核对并确认保存</label><button id="create" class="primary-button">创建行动</button></div></section><div id="message" class="message hidden"></div>
<section><div class="section-title"><h2>行动列表</h2><button id="refresh" class="secondary-button">刷新</button></div><div id="summary" class="metrics"></div><div id="actions" class="cards"></div></section>
</main></div><script src="shell.js"></script><script src="action-tracker.js"></script></body></html>
